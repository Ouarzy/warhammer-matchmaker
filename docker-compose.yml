# Base de données locale de développement : docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matchmaker
      POSTGRES_USER: matchmaker
      POSTGRES_PASSWORD: matchmaker
    ports:
      - "127.0.0.1:5455:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
