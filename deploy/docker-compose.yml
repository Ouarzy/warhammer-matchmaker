# Production : site + PostgreSQL + Caddy (HTTPS automatique) + sauvegarde quotidienne.
# L'image du site est construite par GitHub Actions et publiée sur ghcr.io : le serveur ne compile rien.
# Utilisation sur le serveur : docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: matchmaker

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant dans deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant dans deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

  web:
    # IMAGE_TAG : « latest » ou le hash d'un commit de main (pour revenir à une version précise).
    image: ghcr.io/ouarzy/warhammer-matchmaker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Caddy est devant le site : on fait confiance à ses en-têtes X-Forwarded-* (HTTPS, adresse du client).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Pas de Kerberos (GSS) : sinon Npgsql cherche une bibliothèque absente de l'image et l'écrit dans les journaux.
      ConnectionStrings__Matchmaker: Host=db;Database=matchmaker;Username=matchmaker;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans deploy/.env};GSS Encryption Mode=Disable
      Steam__ApplicationKey: ${STEAM_API_KEY:?STEAM_API_KEY manquant dans deploy/.env}
      # Clés VAPID des notifications push (facultatives : sans elles, la fonction est masquée).
      Push__PublicKey: ${VAPID_PUBLIC_KEY:-}
      Push__PrivateKey: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - keys:/data/keys
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: matchmaker
      POSTGRES_USER: matchmaker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matchmaker -d matchmaker"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Une sauvegarde par jour dans deploy/backups/, gardée 14 jours.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h db -U matchmaker -Fc matchmaker > "/backups/matchmaker-$$(date +%F).dump" \
            && find /backups -name 'matchmaker-*.dump' -mtime +14 -delete \
            && echo "Sauvegarde du $$(date +%F) terminée"
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
  keys:
  pgdata:
