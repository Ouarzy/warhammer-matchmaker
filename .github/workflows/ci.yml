# Tests à chaque push et pull request ; sur main, publication de l'image de production sur ghcr.io.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions épinglées par empreinte (SHA) : un tag déplacé chez un tiers ne change pas ce qui tourne ici. Dependabot les met à jour.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/ouarzy/warhammer-matchmaker

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # Les tests web démarrent un PostgreSQL jetable avec Docker (Testcontainers), disponible sur ce runner.
      - run: dotnet test
      # Script de l'objet TTS : testé avec Lua 5.2, la version que TTS (MoonSharp) imite.
      - run: sudo apt-get install -y --no-install-recommends lua5.2 && lua5.2 tts/tests/WarhammerMatchmaker_test.lua

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
